name: Gerar APK SIRST

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: unzip -o SIRST-V1-Projeto.zip -d projeto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.3

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle -p projeto --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SIRST-V1-APK
          path: projeto/app/build/outputs/apk/debug/*.apk
